<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Notes App</title><style>body{font:16px system-ui;max-width:760px;margin:3rem auto;padding:0 1rem;background:#f6f7f9}form,article{background:white;padding:1rem;margin:1rem 0;border-radius:.6rem}input,button{padding:.6rem;margin:.2rem}input{width:38%}</style><h1>Notes App — Operaciones 1</h1><p id="status">Comprobando…</p><form id="form"><input id="title" required maxlength="200" placeholder="Título"><input id="content" placeholder="Contenido"><button>Crear</button></form><main id="notes"></main>
<script>const statusEl=document.getElementById('status'),notesEl=document.getElementById('notes'),formEl=document.getElementById('form'),titleEl=document.getElementById('title'),contentEl=document.getElementById('content');async function load(){try{let h=await fetch('/health');if(!h.ok)throw new Error('health '+h.status);let r=await fetch('/api/notes');if(!r.ok)throw new Error('notes '+r.status);let xs=await r.json();statusEl.textContent='Backend y base conectados';notesEl.innerHTML=xs.map(x=>`<article><b>${esc(x.title)}</b><p>${esc(x.content)}</p><button onclick="del(${x.id})">Eliminar</button></article>`).join('')}catch(e){statusEl.textContent='Servicio no disponible: '+e.message}}function esc(s){let d=document.createElement('div');d.textContent=s??'';return d.innerHTML}async function del(id){await fetch('/api/notes/'+id,{method:'DELETE'});await load()}formEl.onsubmit=async e=>{e.preventDefault();await fetch('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:titleEl.value,content:contentEl.value})});formEl.reset();await load()};load()</script>
</html>
