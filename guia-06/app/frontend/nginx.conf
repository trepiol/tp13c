server {
  listen 80;
  server_name _;

  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }

  location /api/ {
    proxy_pass http://backend-service:5000/api/;
    proxy_set_header Host $host;
  }

  location = /health {
    proxy_pass http://backend-service:5000/health;
  }

  location = /metrics {
    proxy_pass http://backend-service:5000/metrics;
  }
}
