name: TP13C CI CD and ZAP

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ============================================================
  # 1. LINT
  # ============================================================
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Validar Python
        run: |
          python -m compileall -q guia-06/app/backend/app.py

      - name: Validar scripts Bash
        run: |
          bash -n scripts/*.sh
          bash -n guia-13/scripts/*.sh


  # ============================================================
  # 2. TEST
  # ============================================================
  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Construir backend como prueba
        run: |
          docker build \
            -t notes-backend:test \
            guia-06/app/backend

      - name: Construir frontend como prueba
        run: |
          docker build \
            -t notes-frontend:test \
            guia-06/app/frontend


  # ============================================================
  # 3. BUILD + PUSH A DOCKER HUB
  # ============================================================
  build_push:
    runs-on: ubuntu-latest
    needs: test

    # Publica imágenes tanto en push como en ejecución manual.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validar configuración Docker Hub
        run: |
          if [ -z "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
            echo "ERROR: DOCKERHUB_USERNAME no está configurado"
            exit 1
          fi

          if [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "ERROR: DOCKERHUB_TOKEN no está configurado"
            exit 1
          fi

          echo "Configuración de Docker Hub encontrada"

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y Push backend
        uses: docker/build-push-action@v6
        with:
          context: guia-06/app/backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/notes-backend:${{ github.sha }}

      - name: Build y Push frontend
        uses: docker/build-push-action@v6
        with:
          context: guia-06/app/frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/notes-frontend:${{ github.sha }}

      - name: Build y Push frontend
        uses: docker/build-push-action@v6
        with:
          context: guia-06/app/frontend
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/notes-frontend:${{ github.sha }}

  # ============================================================
  # 4. OWASP ZAP
  # ============================================================
  zap:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    timeout-minutes: 60

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Instalar k3d
        run: |
          curl --fail --silent \
            https://raw.githubusercontent.com/k3d-io/k3d/main/install.sh \
            | bash

      - name: Verificar herramientas
        run: |
          docker --version
          kubectl version --client
          helm version
          k3d version

      - name: Crear cluster k3d
        run: |
          chmod +x scripts/*.sh
          ./scripts/create-cluster.sh

      - name: Desplegar aplicación y monitoring
        run: |
          ./scripts/build-and-deploy.sh

      - name: Verificar estado previo a ZAP
        run: |
          kubectl get nodes
          kubectl get pods -A
          kubectl get svc -A

      - name: Ejecutar OWASP ZAP
        run: |
          kubectl apply -f guia-13/k8s/04-zap-job.yaml

          kubectl wait \
            --for=condition=complete \
            job/zap-security-scan \
            -n devops-portfolio \
            --timeout=40m

      - name: Mostrar logs de ZAP
        if: always()
        run: |
          kubectl logs \
            job/zap-security-scan \
            -n devops-portfolio \
            || true

      - name: Extraer reportes ZAP
        if: always()
        run: |
          chmod +x guia-13/scripts/extract-zap-reports.sh

          if kubectl get pvc zap-reports \
              -n devops-portfolio >/dev/null 2>&1; then

            ./guia-13/scripts/extract-zap-reports.sh
          else
            echo "El PVC zap-reports no existe; no hay reportes para extraer."
          fi

      - name: Mostrar estado final
        if: always()
        run: |
          kubectl get nodes || true
          kubectl get pods -A || true
          kubectl get jobs -n devops-portfolio || true
          kubectl get pvc -n devops-portfolio || true
          ls -lh guia-13/reportes/ || true

      - name: Subir reportes ZAP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-kubernetes-reports
          path: guia-13/reportes/
          if-no-files-found: warn
